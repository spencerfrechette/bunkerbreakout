const RS=[[1.5,1.5],[14.5,14.5],[14.5,8.5],[1.5,8.5]];
function startEscape(){mode='escape';MP=0;oz=false;level=4;P=null;load();P.res=48;KC=[{x:7.5,y:8.5},{x:3.5,y:1.5}];kc=0;et=150;rf=20}

if(kc>=2&&P.x>14.3&&Math.floor(P.y)===1)startOutside()}

const ZS=[[1.5,1.5],[14.5,1.5],[1.5,14.5],[14.5,14.5],[7.5,1.5],[7.5,14.5],[1.5,8.5],[14.5,8.5]];
