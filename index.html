cv.addEventListener('wheel',()=>sw());
const gpOn={},gpPrev=[];

if(!p)return;
const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),ax=i=>Math.abs(p.axes[i]||0)>.2?p.axes[i]:0,hit=i=>b(i)&&!gpPrev[i];
const on=state==='play',lx=ax(0),ly=ax(1);
setK('KeyA',on&&lx<-.3);setK('KeyD',on&&lx>.3);setK('KeyW',on&&ly<-.3);setK('KeyS',on&&ly>.3);
setK('Space',on&&b(0));setK('KeyF',state==='play'&&(b(7)||b(5)));setK('ShiftLeft',on&&(b(4)||b(10)));
if(state==='play'&&P)P.a+=ax(2)*3.2*dt;
if(hit(2)&&state==='play')reload();if((hit(6)||hit(11))&&state==='play')dash();if(hit(14)&&P&&P.lo)selW((P.cur+2)%3);if(hit(15)&&P&&P.lo)selW((P.cur+1)%3);if(hit(1))buy();
if(hit(3))sw();if(hit(12)&&state==='play')showMap=!showMap;if(hit(13)&&state==='play')buyGun();
if(hit(9)){if(state==='play')pause();else if(state==='pause')act(0)}
if(state==='menu'||state==='pause'){const n=btns().length;if(hit(13))sel=(sel+1)%n;if(hit(12))sel=(sel+n-1)%n;if(hit(0))act(sel)}
else if(hit(0)){if(state==='loadout')ldStart();else if(state==='brief')state='play';else if(state==='next')nextLevel();else if(state==='dead')retry();else if(state==='mpend')backToLobby();else if(state==='win')winNext()}
gpPrev.length=0;for(let i=0;i<p.buttons.length;i++)gpPrev[i]=b(i)}
let last=performance.now();

requestAnimationFrame(loop)}
